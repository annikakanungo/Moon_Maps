<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Site Navigator</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--text:#161c28;--muted:#5d6a82;--line:#dbe1ec;--accent:#2a62e8;--chip:#eef2fa;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090d;--panel:#131822;--text:#e7ecf6;--muted:#8f9cb5;--line:#242d3f;--accent:#6e9bff;--chip:#1b2230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07090d;--panel:#131822;--text:#e7ecf6;--muted:#8f9cb5;--line:#242d3f;--accent:#6e9bff;--chip:#1b2230;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
#side{width:380px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
#top{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.brand{font:600 17px/1.2 Georgia,"Times New Roman",serif;margin-bottom:10px;letter-spacing:.2px}
.sb{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:24px;padding:0 16px;height:44px}
.sb input{flex:1;border:0;background:none;color:inherit;font:inherit;outline:0;min-width:0}
.sb:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:16px;padding:5px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#scroll{overflow:auto;flex:1;padding:10px 14px 18px}
.item{display:flex;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;align-items:center}
.item:hover{background:var(--chip)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0}
h2{margin:4px 0 2px;font:600 22px/1.2 Georgia,"Times New Roman",serif}
.btns{display:flex;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:18px;padding:8px 16px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
.row span:last-child{text-align:right}
.note{font-size:12px;color:var(--muted);margin-top:16px}
.dir{position:relative;display:flex;flex-direction:column;gap:8px;padding-right:46px;margin:6px 0 14px}
.dir label{font-size:12px;color:var(--muted)}
select{width:100%;padding:10px;margin-top:3px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit}
.swap{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:16px;cursor:pointer}
.sum{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}
.sum b{font:600 26px/1.1 Georgia,serif}
.mode{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mode>span{font-size:20px;width:26px;text-align:center}
.mode>div{flex:1}
h3{margin:16px 0 0;font-size:14px}
#map{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:22px;cursor:pointer}
#coord{position:absolute;left:10px;bottom:10px;font-size:12px;background:var(--panel);padding:3px 9px;border-radius:8px;border:1px solid var(--line)}
@media(max-width:720px){body{flex-direction:column-reverse}#side{width:100%;height:48%;border-right:0;border-top:1px solid var(--line)}}
</style></head><body>
<aside id="side">
<div id="top"><div class="brand">Lunar Site Navigator</div>
<div class="sb"><span class="muted">&#9906;</span><input id="q" placeholder="Search the Moon" autocomplete="off"></div>
<div class="chips" id="chips"></div></div>
<div id="scroll"></div>
</aside>

<div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">&minus;</button></div></main>
